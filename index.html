 else{const rows=liveRows(e),lead=rows.length?rows[0].tot:0,me=rows.findIndex(x=>x.r.j.me);

  body=rows.map(tr).join('');

  if(!body)body='<tr><td colspan="6" class="mute">Brak wyników</td></tr>'}
 return`<h3>Wyniki na żywo</h3><div class="sc"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`}
function startTable(e,rd){const team=isTeamRd(e);
 const rows=rd.order.map((j,i)=>{const r=rd.res[i],cur=i==rd.i&&!rd.done;
  return`<tr class="${j.me?'me':''}${cur?' cur':''}${r&&i==rd.i-1?' flash':''}"><td class="n">${i+1}</td><td>${flag(j.c)}${esc(j.n)}</td>${r?`<td class="n">${r.g>0?'+':''}${r.g}</td><td class="n">${r.w>0?'+':''}${r.w.toFixed(1)}</td><td class="n">${r.d.toFixed(1)}</td>`:`<td class="n">${cur?'►':''}</td><td></td><td class="n">-</td>`}</tr>`}).join('');
 return`<h3>Lista startowa</h3><div class="sc live" data-cur="1"><table><thead><tr><th class="n">Nr</th><th>Zawodnik</th><th class="n">Belka</th><th class="n">Wiatr</th><th class="n">m</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function windBox(rd){const w=rd.nw===undefined?rd.cw:rd.nw,pos=clamp(50+w/3*50,2,98),hist=rd.ws.slice(-6).map(x=>(x>0?'+':'')+x.toFixed(1)).join(' ');
 return`<div class="wind"><div class="wt"><span>WIATR TERAZ</span><span>skoczyło ${rd.i}/${rd.order.length}</span></div><div class="wv">${w>0?'+':''}${w.toFixed(2)}<small class="mono"> m/s</small></div><div class="wb"><i style="left:${pos}%"></i></div><div class="wt" style="justify-content:center"><b style="color:var(--ink)">◄ ${Math.abs(w)<.25?'bezwietrznie':w>0?'pod narty':'w plecy'} ►</b></div><div class="wt"><span>Belka jury</span><b style="color:var(--ink)">${sg(rd.g)}</b></div>${hist?`<div class="wt" style="font-size:11px">Ost.: ${hist}</div>`:''}</div>`}
function gateBox(e,rd){const ev=e.ev,sc=ev.hs/130,w=rd.nw===undefined?rd.cw:rd.nw,hint=w<-.8?'Wiatr w plecy: wyższa belka daje prędkość, ale większe ryzyko.':w>.8?'Wiatr pod narty: możesz zejść z belki i zyskać punkty, kosztem długości.':'Warunki stabilne: zmiana belki to czyste ryzyko.';
 return`<p class="mono mute" style="font-size:13px;margin:6px 0">${hint}</p><div class="gate" role="radiogroup" aria-label="Belka">${[-2,-1,0,1,2].map(d=>`<label><input type="radio" name="gate" value="${d}"${d==0?' checked':''}>${sg(rd.g+d)}<span>${d==0?'jak jury':(d>0?'wyżej':'niżej')+' '+Math.abs(d)}${d?`<br>${d>0?'+':'−'}${(Math.abs(d)*3*sc).toFixed(0)} m · ${d>0?'−':'+'}${(Math.abs(d)*6*sc).toFixed(0)} pkt`:''}</span></label>`).join('')}</div><p class="mono mute" style="font-size:12px;margin:2px 0 6px">Wyższa belka: dalszy skok, ale większy rozrzut i ryzyko upadku. Niższa: bezpieczniej, krótszy skok, punkty za belkę.</p>`}
function livePanel(e,rd){const ev=e.ev,ph=rd.ph,next=rd.order[rd.i],meTurn=next&&next.me,meAhead=rd.order.slice(rd.i).some(j=>j.me),m=rd.res.find(x=>x.j.me);
 let h=`<div class="topgrid"><div>${banner(e,rd)}</div>${windBox(rd)}</div><div style="max-width:720px;margin:0 auto">${hillLive(e,rd)}</div>`;
 if(!rd.done){
  if(meAhead)h+=`<div class="notice promo">${leadInfo(e,rd)}</div>`;
  if(meTurn)h+=`<div><b>Twoja kolej.</b> Wybierz belkę i styl skoku.</div>${gateBox(e,rd)}<div class="risk" role="radiogroup" aria-label="Styl skoku"><label><input type="radio" name="risk" value="s"><b>Zachowawczo</b><span class="mute">Mniejszy rozrzut, krótszy skok</span></label><label><input type="radio" name="risk" value="n" checked><b>Normalnie</b><span class="mute">Pewny rytm</span></label><label><input type="radio" name="risk" value="a"><b>Ryzykownie</b><span class="mute">Daleko albo słabo</span></label></div><div class="row"><button class="b k" data-act="jump">Skocz</button></div>`;
  else h+=`<div class="row" style="margin:8px 0"><button class="b" data-act="step" data-v="1">1 skoczek</button><button class="b" data-act="step" data-v="5">5 skoczków</button><button class="b p" data-act="step" data-v="999">${meAhead?'Do mojego skoku':'Do końca serii'}</button></div>`}
 if(m){const team=isTeamRd(e),rk=team?teamLive(e).findIndex(x=>x.c==S.cc)+1:liveRows(e).findIndex(x=>x.r===m)+1,lastR=rd.res[rd.res.length-1];
  h+=`<p class="mono" style="margin:8px 0"><b>Twój skok:</b> ${m.d.toFixed(1)} m · ${m.p.toFixed(1)} pkt · ${rk}. ${team?'miejsce drużyny':'miejsce teraz'}</p>`+(lastR!==m?`<details><summary class="mono">Noty i punkty twojego skoku</summary>${judges(m)}</details>`:'')}
 if(rd.done){const rk=e[ph].findIndex(x=>x.j.me)+1;
  if(ph=='q'&&rk>50)h+='<div class="notice">Nie awansujesz do konkursu. Ten weekend kończysz na kwalifikacjach.</div>';
  if(ev.fm=='ind'&&ph=='r1'&&rk>30)h+='<div class="notice">Poza trzydziestką. Seria finałowa bez ciebie.</div>';
  h+=`<p><button class="b p" data-act="nextph">${endNow()?'Zakończ konkurs':'Dalej'}</button></p>`}
 h+=`<div class="cols"><div>${startTable(e,rd)}</div><div>${standTable(e,rd)}</div></div>${isTeamRd(e)?myTeamBox(Object.assign({},e,{r1:ph=='r1'?rd.res:e.r1,r2:ph=='r2'?rd.res:e.r2})):''}<h3>Relacja</h3><div class="log">${rd.log.slice(0,14).map(x=>'<div>'+x+'</div>').join('')}</div>`;
 return h}
function phasePanel(){const e=S.ev,ev=e.ev,ph=e.ph;if(ph=='done')return donePanel();
 const rd=e.rd&&e.rd.ph==ph?e.rd:null;
 let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2>${PHL(e)}</h2><span class="mono mute">${ev.p} · K${ev.k} / HS${ev.hs}</span></div>${wxNote(e)}${rd?'':hill(ev,e.mk)}`;

  return h+`<div class="row"><button class="b k" data-act="rstart">Rozpocznij serię</button>${ph=='t2'?'<button class="b" data-act="skip">Pomiń drugi trening</button>':''}</div></div>`}
 return h+livePanel(e,rd)+'</div>'}
function donePanel(){const e=S.ev,s=e.sum,ev=e.ev;
 if(e.cancel)return`<div class="card"><h2>Konkurs odwołany</h2><p>${esc(ev.p)}: silny wiatr uniemożliwił rozegranie konkursu. Nie ma punktów ani klasyfikacji.</p><button class="b k" data-act="nextev">Następny konkurs</button></div>`;

 ${s.fell?'<div class="notice">Upadek przy lądowaniu. Noty za ten skok są mocno obniżone.</div>':''}${s.inj?`<div class="notice">Kontuzja: ${s.inj.n}. Opuścisz około ${s.inj.left} konkursów.</div>`:''}${s.gain&&s.gain.length?`<div class="notice promo">Rozwój po konkursie: ${s.gain.map(x=>'+1 '+x).join(', ')}.</div>`:''}
 ${ev.l=='w'&&s.rk&&s.rk<=3?`<div class="notice promo">Medal mistrzostw świata: ${['złoty','srebrny','brązowy'][s.rk-1]}!</div>`:''}
 ${s.promo?`<div class="notice promo">${s.promo}</div>`:''}
 <h3>Klasyfikacja końcowa konkursu</h3>${s.team?teamTable(e.tt,12)+myTeamBox(e):tableTot(e.fin,12)}
 <p class="row"><button class="b k" data-act="nextev">Następny konkurs</button>${(ev.l=='g'||ev.l=='c')?`<button class="b" data-act="tab-s">Wydaj punkty treningowe (${S.tp})</button>`:''}</p></div>`}
function nextCard(){const e=S.evs[S.idx];if(!e)return'';
 return`<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(e.p)}</h2><span class="mono">${dfmt(e.d)}</span></div>
 <div class="row"><span class="pill l${e.l}">${LV[e.l]}</span>${e.fm=='team'?'<span class="pill">drużyny</span>':e.fm=='mix'?'<span class="pill">mikst</span>':''}${e.v?'<span class="pill">Termin FIS</span>':'<span class="pill e">Termin orientacyjny</span>'}<span class="mono mute">${flag(e.c)}${CC[e.c]} · K${e.k} · HS${e.hs}${e.hs>=200?' · loty':''}</span></div>${hill(e)}
 ${S.note?'<div class="notice">'+S.note+'</div>':''}<p class="mono mute">Prognoza: wiatr ${wxLabel(wxP(e))}. Forma w ostatnich startach: ${formLbl(S.form)}.</p>
 ${e.l==3&&S.lvl==2&&e.fm=='ind'?'<div class="notice promo">Powołanie od trenera na ten konkurs Pucharu Świata.</div>':e.fm!='ind'?'<div class="notice promo">Zakwalifikowałeś się do składu drużyny narodowej.</div>':''}
 <p class="mute">${e.fm=='ind'?'Program: dwa treningi, kwalifikacje, dwie serie konkursowe.':e.fm=='team'?'Program: seria próbna i dwie serie drużynowe. Skacze czterech zawodników każdej drużyny.':'Program: seria próbna i dwie serie. Drużyna to dwóch mężczyzn i dwie kobiety.'}</p><button class="b k" data-act="start">Wejdź na skocznię</button></div>`}
function viewK(){if(S.retired)return careerCard();if(S.end)return endCard();
 const main=S.ev?phasePanel():nextCard();if(S.ev&&S.ev.rd)return`<div>${main}</div><div style="margin-top:16px">${sideCard()}</div>`;return`<div class="grid"><div>${main}</div><div>${sideCard()}</div></div>`}
function endCard(){const s=S.end;return`<div class="card"><h2>Koniec sezonu ${seasonLabel(S.off)}</h2><p>${LV[s.l]}: ${s.rk?s.rk+'. miejsce na '+s.total+' sklasyfikowanych':'bez punktów w klasyfikacji'}.</p>${s.promo?`<div class="notice promo">${s.promo}</div>`:''}<p class="mute">Po zimie i lecie zaczyna się sezon ${seasonLabel(S.off+1)}. Przed pierwszym konkursem zimy dostajesz 14 pkt treningowych do rozdania, a latem kolejne za każdy konkurs Grand Prix.</p>${S.age>=30?`<div class="notice">Masz ${S.age} lat. ${mustRetire()?'To koniec drogi: wiek nie pozwala już na dalsze starty.':'Możesz walczyć dalej albo zakończyć karierę. Po trzydziestce umiejętności zaczynają spadać.'}</div>`:''}${S.inj?'<div class="notice">Nadal leczysz kontuzję: '+S.inj.n+'.</div>':''}<div class="row">${mustRetire()?'':'<button class="b k" data-act="newseason">Nowy sezon</button>'}${S.age>=30?'<button class="b" data-act="retire">'+(mustRetire()?'Zakończ karierę':'Zakończ karierę')+'</button>':''}</div></div>${newsCard(S.news)}`}
const MN=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'],MS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function viewCal(){const evs=S.evs.filter(e=>!CALF||e.l==CALF),nxt=S.evs[S.idx];let lastM='';
 const items=evs.map(e=>{const mi=+e.d.slice(5,7)-1,key=e.d.slice(0,7),head=key!==lastM?(lastM=key,`<h3 class="mh">${MN[mi]} ${e.d.slice(0,4)}</h3>`):'',cur=nxt===e,
  fmt=e.fm=='team'?'<span class="pill">drużyny</span>':e.fm=='mix'?'<span class="pill">mikst</span>':'',
  res=e.done?`<div class="mono tr">${e.win==='odwołany'?'Konkurs odwołany':'Wygrał: '+esc(e.win||'')}${e.myrk?' · Ty: '+e.myrk+'. miejsce':''}</div>`:'';
  return head+`<div class="tl${cur?' now':e.done?' past':''}"><div class="dt"><b>${e.d.slice(8)}</b><span>${MS[mi]}</span></div><div class="tb"><div class="tt">${flag(e.c)}${esc(e.p)}${cur?' <span class="pill l3">następny</span>':''}</div><div class="row"><span class="pill l${e.l}">${e.l==3?'PŚ':e.l=='w'?'MŚ':e.l=='g'?'GP':e.l=='c'?'LCOC':'COC'}</span>${fmt}${e.v?'':'<span class="pill e">≈</span>'}<span class="mono mute">K${e.k} · HS${e.hs}${e.hs>=200?' · loty':''}</span></div>${res}</div></div>`}).join('');
 return`<div class="row" style="margin-bottom:12px">${[0,2,3,'g','c','w'].map(l=>`<button class="chip" aria-pressed="${CALF===l}" data-act="calf" data-v="${l}">${l?LV[l]:'Wszystkie'}</button>`).join('')}</div><div class="card tlw">${items}</div><p class="mute">Terminy Pucharu Świata pochodzą z kalendarza FIS 2026/27. Znak ≈ oznacza orientacyjny termin Letniego Grand Prix i Pucharu Kontynentalnego. Konkursy drużynowe i mistrzostwa świata w Falun są pominięte w tej wersji.</p>`}
function viewSt(){const l=LVF||S.lvl;
 return`<div class="row" style="margin-bottom:12px">${[2,3,'g','c','n','w'].map(x=>`<button class="chip" aria-pressed="${l==x}" data-act="lvf" data-v="${x}">${LV[x]}</button>`).join('')}</div><div class="grid"><div>${standCard(l,false)}</div><div class="card"><h3>Kariera</h3>${S.hist.length?`<table><thead><tr><th>Sezon</th><th>Poziom</th><th class="n">Msc</th><th class="n">OVR</th></tr></thead><tbody>${S.hist.map(h=>`<tr><td>${h.s}</td><td>${LV[h.l]}</td><td class="n">${h.rk||'-'}</td><td class="n">${h.o}</td></tr>`).join('')}</tbody></table>`:'<p class="mute">Pierwszy sezon w toku.</p>'}${S.wch.length?'<h3>Mistrzostwa świata</h3><table><tbody>'+S.wch.map(x=>`<tr><td>${x.s}</td><td>${esc(x.ev)}</td><td class="n">${x.rk?x.rk+'.':'-'}${x.team?' (drużyna)':''}</td></tr>`).join('')+'</tbody></table>':''}</div></div>`}
const cost=v=>v<60?1:v<75?2:v<90?3:4;
const canUp=()=>!S.retired&&(phase()=='Lato'||S.pre);
function phase(){const e=S.evs[S.idx];return e&&(e.l=='g'||e.l=='c')?'Lato':'Zima'}
function viewS(){const o=ovr(S.a),th=S.lvl<3?{2:[64,10]}[S.lvl]:null,summer=phase()=='Lato'&&!S.ev;
 return`<div class="card"><div class="row" style="justify-content:space-between"><h2>${flag(S.cc)}${esc(S.name)} · ${CC[S.cc]} · ${S.age} lat</h2><span class="mono">Pkt treningowe: <b>${S.tp}</b></span></div>
 <div class="row" style="gap:16px;margin:10px 0"><div class="ovr">${o}</div><div class="mute">Overall (maks. 100)${th?`<br>Awans do ${LV[S.lvl+1]}: overall ${th[0]}+ i miejsce w czołowej ${th[1]} klasyfikacji, po minimum 3 konkursach.`:'<br>Jesteś w Pucharze Świata.'}</div></div>
 ${Object.keys(ATTR).map(k=>`<div class="attr"><span>${ATTR[k]}</span><div class="bar"><i style="width:${S.a[k]}%"></i></div><b class="mono">${S.a[k]}</b><button class="b" data-act="up" data-v="${k}" ${!canUp()||S.tp<cost(S.a[k])||S.a[k]>=100?'disabled':''} aria-label="Podnieś: ${ATTR[k]}">+${cost(S.a[k])}</button></div>`).join('')}
 <div class="notice ${canUp()?'promo':''}">${phase()=='Lato'?'Lato: przydzielasz punkty sam. Wolne punkty możesz wydać między konkursami Grand Prix.':S.pre?'Przedsezon: rozdziel punkty treningowe przed pierwszym konkursem zimy.':'Zima: rozwój odbywa się automatycznie po każdym konkursie. Lepsze wyniki i młody wiek dają szybszy postęp. Punkty ręczne dostaniesz znowu latem.'}</div>
 <p class="mute">Wybicie i faza lotu liczą się najmocniej. Styl i lądowanie wpływają na noty, psychika na rozrzut skoków. Koszt rośnie wraz z poziomem.</p></div>${squadCard()}${youngCard()}`}
function setup(){return`<div class="top"><div class="brand">Kariera <i>Skoczka</i></div></div><div class="card" style="max-width:520px;margin-top:20px"><h2>Nowa kariera</h2><p class="mute">Zaczynasz w wieku 16 lat zimą w Pucharze Kontynentalnym. Po sezonie zimowym startujesz latem w letniej serii swojego poziomu (Grand Prix dla Pucharu Świata, Letni Puchar Kontynentalny dla zaplecza) i sam rozdzielasz punkty rozwoju, zimą rozwój liczy się automatycznie. Celem jest awans do Pucharu Świata.</p>
 <p><label for="nm">Imię i nazwisko</label><input type="text" id="nm" value="Jan Kowalski" maxlength="30"></p>
 <p><label for="cc">Reprezentacja</label><select id="cc">${Object.keys(CC).map(c=>`<option value="${c}"${c=='POL'?' selected':''}>${CC[c]}</option>`).join('')}</select></p><button class="b k" data-act="new">Zacznij karierę</button></div>`}
function render(){const app=document.getElementById('app');if(!S){app.innerHTML=setup();return}
 const o=ovr(S.a),tabs=[['k','Konkurs'],['c','Kalendarz'],['t','Klasyfikacje'],['s','Skoczek']];
 app.innerHTML=`<div class="top"><div class="brand">Kariera <i>Skoczka</i></div><div class="who"><span>${flag(S.cc)}<b>${esc(S.name)}</b> · ${S.cc} · ${S.age} lat</span><span class="pill l${S.lvl}">${LV[S.lvl]}</span><span class="pill">Forma: ${formLbl(S.form)}</span><span class="mono mute">${phase()} ${seasonLabel(S.off)}</span><div class="ovr" title="Overall">${o}</div></div></div>
 <nav>${tabs.map(t=>`<button data-act="tab-${t[0]}" aria-current="${TAB==t[0]}">${t[1]}</button>`).join('')}<button data-act="reset" style="margin-left:auto">Nowa gra</button></nav>${TAB=='k'?viewK():TAB=='c'?viewCal():TAB=='t'?viewSt():viewS()}`;
 const lv=document.querySelector('.live');if(lv){const c=lv.querySelector('.cur')||lv.querySelector('tr.me');if(c)lv.scrollTop+=c.getBoundingClientRect().top-lv.getBoundingClientRect().top-lv.clientHeight/2}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a=='new'){const n=document.getElementById('nm').value.trim()||'Zawodnik';newGame(n,document.getElementById('cc').value);TAB='k'}
 else if(a=='reset'){if(b.dataset.sure){S=null;try{localStorage.removeItem('skoczek-v7')}catch(e){}}else{b.dataset.sure=1;b.textContent='Na pewno? Kliknij jeszcze raz';return}}
 else if(a.startsWith('tab-'))TAB=a[4];
 else if(a=='start')startEvent();
 else if(a=='jump'){const r=document.querySelector('input[name=risk]:checked'),g=document.querySelector('input[name=gate]:checked');if(S.ev&&S.ev.rd)S.ev.rd.pg=g?+g.value:0;playMe(r?r.value:'n')}
 else if(a=='rstart')startRound();else if(a=='step')stepRound(+v);
 else if(a=='skip'){S.ev.ph=S.ev.wx=='q'?'r1':'q';S.ev.jumped=false;S.ev.mk=null}
 else if(a=='nextph')nextPh();
 else if(a=='nextev'){nextEvent();TAB='k'}
 else if(a=='newseason')newSeason();
 else if(a=='retire'){if(b.dataset.sure){retire()}else{b.dataset.sure=1;b.textContent='Na pewno? Kliknij jeszcze raz';return}}
 else if(a=='calf')CALF=v=='g'?'g':+v;else if(a=='lvf')LVF=v=='g'?'g':+v;
 else if(a=='up'){const c=cost(S.a[v]);if(S.tp>=c&&S.a[v]<100){S.tp-=c;S.a[v]++;save()}}
 render()});
render();
</script>
